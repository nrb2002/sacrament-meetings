<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio loading skeleton with dynamic project cards</title>
  <desc id="desc">A mock portfolio page showing a hero section and a projects grid where one card is loaded and two cards are still represented by skeleton placeholders, illustrating dynamic rendering progress.</desc>

  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .headerBg { fill: #edf2f7; stroke: #d9e2ec; stroke-width: 1.5; }
      .studentName { fill: #102a43; font: 700 16px 'Open Sans', Arial, sans-serif; }
      .navText { fill: #334e68; font: 700 14px 'Open Sans', Arial, sans-serif; }
      .pageTitle { fill: #102a43; font: 700 22px 'Open Sans', Arial, sans-serif; }
      .label { fill: #334e68; font: 700 14px 'Open Sans', Arial, sans-serif; }
      .loadedCard { fill: #f8fbff; stroke: #9fb3c8; stroke-width: 2; }
      .loadedTitle { fill: #102a43; font: 700 15px 'Open Sans', Arial, sans-serif; }
      .loadedBody { fill: #486581; font: 400 13px 'Open Sans', Arial, sans-serif; }
      .chip { fill: #e6fffa; stroke: #2c7a7b; stroke-width: 1.5; }
      .chipText { fill: #285e61; font: 700 12px 'Open Sans', Arial, sans-serif; }
      .skeletonCard { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .skeletonLine { fill: #dbe5ef; }
      .skeletonBlock { fill: #e2e8f0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="520" rx="12" />
  <rect class="panel" x="32" y="30" width="896" height="458" rx="12" />

  <rect class="headerBg" x="56" y="54" width="848" height="46" rx="8" />
  <text class="studentName" x="74" y="83">Alex Carter</text>
  <text class="navText" x="700" y="83">Home</text>
  <text class="navText" x="752" y="83">About</text>
  <text class="navText" x="808" y="83">Projects</text>

  <text class="pageTitle" x="56" y="132">Portolio</text>

  <rect class="panel" x="56" y="142" width="848" height="96" rx="10" />
  <text class="label" x="74" y="168">HeroSection (static content)</text>
  <rect class="skeletonBlock" x="74" y="180" width="320" height="14" rx="7" />
  <rect class="skeletonLine" x="74" y="202" width="520" height="10" rx="5" />
  <rect class="skeletonLine" x="74" y="218" width="460" height="10" rx="5" />

  <text class="label" x="56" y="266">ProjectList (dynamic cards from server data)</text>

  <!-- Loaded card -->
  <rect class="loadedCard" x="56" y="282" width="268" height="168" rx="12" />
  <text class="loadedTitle" x="74" y="310">ProjectCard: Weather API</text>
  <text class="loadedTitle" x="74" y="330">Dashboard</text>
  <rect class="skeletonLine" x="74" y="324" width="228" height="1" rx="0" />
  <text class="loadedBody" x="74" y="354">Server-rendered summary and metadata</text>
  <text class="loadedBody" x="74" y="372">arrive first for this card.</text>
  <rect class="chip" x="74" y="388" width="78" height="24" rx="12" />
  <text class="chipText" x="113" y="404" text-anchor="middle">Next.js</text>
  <rect class="chip" x="158" y="388" width="86" height="24" rx="12" />
  <text class="chipText" x="201" y="404" text-anchor="middle">TypeScript</text>

  <!-- Skeleton card 1 -->
  <rect class="skeletonCard" x="346" y="282" width="268" height="168" rx="12" />
  <rect class="skeletonBlock" x="364" y="304" width="180" height="14" rx="7" />
  <rect class="skeletonLine" x="364" y="330" width="228" height="10" rx="5" />
  <rect class="skeletonLine" x="364" y="346" width="210" height="10" rx="5" />
  <rect class="skeletonLine" x="364" y="362" width="160" height="10" rx="5" />
  <rect class="skeletonBlock" x="364" y="388" width="74" height="22" rx="11" />
  <rect class="skeletonBlock" x="446" y="388" width="90" height="22" rx="11" />

  <!-- Skeleton card 2 -->
  <rect class="skeletonCard" x="636" y="282" width="268" height="168" rx="12" />
  <rect class="skeletonBlock" x="654" y="304" width="194" height="14" rx="7" />
  <rect class="skeletonLine" x="654" y="330" width="228" height="10" rx="5" />
  <rect class="skeletonLine" x="654" y="346" width="216" height="10" rx="5" />
  <rect class="skeletonLine" x="654" y="362" width="176" height="10" rx="5" />
  <rect class="skeletonBlock" x="654" y="388" width="74" height="22" rx="11" />
  <rect class="skeletonBlock" x="736" y="388" width="90" height="22" rx="11" />
</svg>
